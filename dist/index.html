<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e85a71">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="福岡2026">
  <meta name="description" content="2026 福岡・九州自由行五日隨身數位手冊">
  <title>2026 福岡・九州自由行 | 行程隨身手冊</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛩️</text></svg>">
  <style>
    :root {
      --primary: #e85a71;
      --primary-dark: #c93b52;
      --primary-light: #fff0f3;
      --primary-subtle: #fbe4e8;
      --accent-blue: #3a86ff;
      --accent-teal: #06d6a0;
      --accent-amber: #f59e0b;
      --accent-purple: #8338ec;
      --bg-canvas: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-muted: #f8fafc;
      --border-subtle: #e2e8f0;
      --border-focus: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --nav-height: 64px;
    }

    /* Reset & Base System */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* html's overflow propagates to the viewport; body must not become a scroll container or sticky breaks */
    body {
      overflow-x: clip;
    }

    /* Mobile Container App Shell */
    .app-shell {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-surface);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
      overflow-x: hidden;
      overflow-x: clip; /* clip doesn't create a scroll container, keeps position: sticky working */
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + var(--nav-height) + 12px);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* App Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #e85a71, #ff758c);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      box-shadow: 0 3px 10px rgba(232, 90, 113, 0.35);
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background-color: var(--primary-light);
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: 1px solid var(--primary-subtle);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
      padding: 14px 16px;
    }

    /* Tab Views */
    .tab-view {
      display: none;
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Skeleton Placeholder for Initial Layout */
    .view-section {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .hero-banner {
      background: linear-gradient(135deg, #e85a71 0%, #fa709a 100%);
      color: #ffffff;
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .hero-banner::after {
      content: "✈️";
      position: absolute;
      right: 14px;
      bottom: 8px;
      font-size: 52px;
      opacity: 0.18;
      pointer-events: none;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      opacity: 0.95;
    }

    .hero-tag {
      background: rgba(255, 255, 255, 0.22);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-weight: 500;
      backdrop-filter: blur(4px);
    }

    /* Bottom Navigation Skeleton */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(226, 232, 240, 0.9);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-sizing: border-box;
    }

    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: color 0.2s ease, transform 0.15s ease;
      padding: 4px 0;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 700;
    }

    .nav-icon {
      font-size: 20px;
      line-height: 1;
      margin-bottom: 3px;
    }

    .nav-label {
      font-size: 11px;
      letter-spacing: -0.2px;
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      top: calc(var(--safe-top) + 60px);
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-container.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ===== Timeline (Task 2.3) ===== */
    :root { --header-h: 67px; } /* synced to real header height via JS */

    .day-bar {
      position: sticky;
      top: calc(var(--safe-top) + var(--header-h));
      z-index: 80;
      margin: 0 -16px 12px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .day-bar::-webkit-scrollbar { display: none; }

    .day-chip {
      flex: 0 0 auto;
      scroll-snap-align: start;
      border: 1px solid var(--border-subtle);
      background: var(--bg-muted);
      color: var(--text-sub);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      min-width: 64px;
      text-align: center;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .day-chip .chip-day { display: block; font-size: 13px; font-weight: 700; }
    .day-chip .chip-date { display: block; font-size: 11px; opacity: 0.8; }
    .day-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(232, 90, 113, 0.3);
    }

    .day-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .day-summary h2 { font-size: 16px; font-weight: 800; line-height: 1.35; }
    .day-summary .count { flex: 0 0 auto; font-size: 12px; color: var(--text-muted); }

    .timeline { position: relative; }
    .tl-item {
      display: grid;
      grid-template-columns: 46px 28px minmax(0, 1fr);
      column-gap: 6px;
      position: relative;
      padding-bottom: 12px;
    }
    .tl-item::before { /* vertical rail */
      content: "";
      position: absolute;
      left: 65px;
      top: 26px;
      bottom: 0;
      width: 2px;
      background: var(--border-subtle);
    }
    .tl-item:last-child::before { display: none; }

    .tl-time { text-align: right; padding-top: 4px; font-variant-numeric: tabular-nums; }
    .tl-time .t-start { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); }
    .tl-time .t-end { display: block; font-size: 11px; color: var(--text-muted); }
    .tl-time .t-none { font-size: 11px; color: var(--text-muted); }

    .tl-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: var(--bg-muted);
      border: 2px solid var(--border-subtle);
      position: relative;
      z-index: 1;
    }
    .cat-flight .tl-dot { background: #eaf2ff; border-color: var(--accent-blue); }
    .cat-transport .tl-dot { background: #f3ecff; border-color: var(--accent-purple); }
    .cat-food .tl-dot { background: #fff5e6; border-color: var(--accent-amber); }
    .cat-shopping .tl-dot { background: var(--primary-light); border-color: var(--primary); }
    .cat-sightseeing .tl-dot { background: #e7fbf5; border-color: var(--accent-teal); }
    .cat-hotel .tl-dot { background: #eef2f7; border-color: #64748b; }

    .tl-card {
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
    }
    .tl-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .map-link {
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: var(--accent-blue);
      background: #eaf2ff;
      border-radius: var(--radius-pill);
      padding: 2px 8px;
    }
    .tl-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      max-width: 100%;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sub);
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 2px 8px;
      overflow-wrap: anywhere;
    }
    .tag.booked-yes { color: #047857; background: #ecfdf5; border-color: #a7f3d0; }

    .tl-remarks { margin-top: 8px; }
    .tl-remarks summary {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-dark);
      cursor: pointer;
      list-style: none;
    }
    .tl-remarks summary::-webkit-details-marker { display: none; }
    .tl-remarks summary::before { content: "▸ "; }
    .tl-remarks[open] summary::before { content: "▾ "; }
    .tl-remarks p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-sub);
      background: var(--bg-muted);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }

    /* ===== Info cards & utilities (Task 2.4) ===== */
    .section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 800;
      margin: 4px 0 12px;
    }
    .section-title + .section-hint { margin-top: -8px; }
    .section-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .sub-title { font-size: 14px; font-weight: 700; color: var(--text-sub); margin: 18px 0 10px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 12px 14px;
      margin-bottom: 10px;
      min-width: 0;
    }

    .flight-card { padding: 0; overflow: hidden; margin-bottom: 14px; }
    .flight-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      color: #fff;
      background: linear-gradient(135deg, #3a86ff, #5e9bff);
    }
    .flight-card.inbound .flight-head { background: linear-gradient(135deg, #8338ec, #a066f5); }
    .flight-head .f-type { font-weight: 800; font-size: 14px; }
    .flight-head .f-date { font-size: 12px; opacity: 0.92; }
    .flight-body { padding: 12px 14px; }
    .flight-route {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }
    .f-end .f-time { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
    .f-end .f-airport { font-size: 12px; font-weight: 600; color: var(--text-main); overflow-wrap: anywhere; }
    .f-end .f-terminal { font-size: 11px; color: var(--text-muted); }
    .f-end.arr { text-align: right; }
    .f-mid { text-align: center; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .f-mid .plane { display: block; font-size: 18px; }
    .flight-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .flight-steps { margin-top: 10px; display: grid; gap: 6px; }
    .flight-steps div {
      font-size: 12px;
      color: var(--text-sub);
      background: var(--bg-muted);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      overflow-wrap: anywhere;
    }
    .flight-note { margin-top: 8px; font-size: 12px; color: var(--text-sub); overflow-wrap: anywhere; }

    .coupon-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .coupon-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      padding: 12px;
      border-top: 3px solid var(--primary);
    }
    .coupon-card .badge {
      align-self: flex-start;
      max-width: 100%;
      font-size: 10px;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--primary-light);
      border-radius: var(--radius-pill);
      padding: 2px 8px;
      overflow-wrap: anywhere;
    }
    .coupon-card .c-title { font-size: 14px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .coupon-card .c-desc { font-size: 12px; color: var(--text-sub); flex: 1; overflow-wrap: anywhere; }
    .coupon-card .c-cat { font-size: 11px; color: var(--text-muted); }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 32px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: var(--bg-muted);
      color: var(--text-sub);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-blue { background: #eaf2ff; border-color: #cfe0ff; color: var(--accent-blue); }

    .info-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .info-row + .info-row { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-subtle); }
    .info-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; overflow-wrap: anywhere; }
    .info-label { font-size: 11px; color: var(--text-muted); }
    .info-value { font-size: 13px; color: var(--text-main); overflow-wrap: anywhere; }
    .info-value a { color: inherit; }
    .info-text { min-width: 0; flex: 1; }
    .info-note { font-size: 12px; color: var(--text-sub); margin-top: 6px; overflow-wrap: anywhere; }

    .todo-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  </style>
</head>
<body>
  <div class="app-shell" id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">⛩️</div>
        <div>
          <div class="brand-title">福岡・九州自由行</div>
          <div class="brand-subtitle">2026.11.12 - 11.16・5 Days</div>
        </div>
      </div>
      <div class="header-badge">5天4夜</div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <section class="hero-banner">
        <div class="hero-title">福岡之旅 2026</div>
        <div class="hero-meta">
          <span class="hero-tag">📅 11/12 (四) ~ 11/16 (一)</span>
          <span class="hero-tag">📍 博多・天神・門司港・熊本</span>
          <span class="hero-tag">✈️ 華航/星宇 TPE ⇄ FUK</span>
        </div>
      </section>

      <!-- Tab 1: 每日行程 -->
      <div id="view-schedule" class="tab-view active">
        <nav class="day-bar" id="dayBar" aria-label="選擇日期"></nav>
        <div id="schedule-container">
          <div class="day-summary" id="daySummary"></div>
          <div class="timeline" id="timeline">
            <div class="loading-state empty-state">
              <div style="font-size: 28px; margin-bottom: 8px;">⏳</div>
              <div>載入行程中...</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab 2: 航班資訊 -->
      <div id="view-flights" class="tab-view">
        <div class="section-title"><span>✈️</span><span>航班與出入境資訊</span></div>
        <div id="flights-container"></div>
      </div>

      <!-- Tab 3: 優惠券 -->
      <div id="view-coupons" class="tab-view">
        <div class="section-title"><span>🏷️</span><span>旅日優惠券與實用連結</span></div>
        <div class="section-hint">建議出發前先開啟一次並存到手機，離線也能出示。</div>
        <div id="coupons-container"></div>
      </div>

      <!-- Tab 4: 實用資訊 -->
      <div id="view-practical" class="tab-view">
        <div class="section-title"><span>ℹ️</span><span>緊急求助與旅日必備</span></div>
        <div id="practical-container"></div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-tab="schedule" aria-label="每日行程">
        <span class="nav-icon">📅</span>
        <span class="nav-label">每日行程</span>
      </button>
      <button class="nav-item" data-tab="flights" aria-label="航班資訊">
        <span class="nav-icon">✈️</span>
        <span class="nav-label">航班資訊</span>
      </button>
      <button class="nav-item" data-tab="coupons" aria-label="優惠券">
        <span class="nav-icon">🏷️</span>
        <span class="nav-label">優惠券</span>
      </button>
      <button class="nav-item" data-tab="practical" aria-label="實用資訊">
        <span class="nav-icon">ℹ️</span>
        <span class="nav-label">實用資訊</span>
      </button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container">已複製</div>
  </div>

  <script>
    // Tab Switching Controller
    function switchTab(tabId) {
      // 1. Update Navigation Buttons
      const navButtons = document.querySelectorAll('#bottomNav .nav-item');
      navButtons.forEach(btn => {
        if (btn.getAttribute('data-tab') === tabId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 2. Toggle Tab Views (Instantaneous, no white flash)
      const tabViews = document.querySelectorAll('.tab-view');
      tabViews.forEach(view => {
        if (view.id === 'view-' + tabId) {
          view.classList.add('active');
        } else {
          view.classList.remove('active');
        }
      });

      // 3. Reset scroll position smoothly
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // Attach click listeners to all tab buttons
    document.querySelectorAll('#bottomNav .nav-item').forEach(button => {
      button.addEventListener('click', (e) => {
        e.preventDefault();
        const targetTab = button.getAttribute('data-tab');
        if (targetTab) {
          switchTab(targetTab);
        }
      });
    });

    console.log("Tab navigation controller initialized.");

    // ===== Shared helpers =====
    const APP = { data: null, dayIndex: 0 };
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const mapUrl = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

    // Keep sticky offsets in sync with the real header height (fonts / safe-area may change it)
    (function syncHeaderHeight() {
      const header = document.querySelector('.app-header');
      const apply = () => document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
      apply();
      if ('ResizeObserver' in window) new ResizeObserver(apply).observe(header);
    })();

    // ===== Timeline (Task 2.3) =====
    const CAT_ICON = { flight: '✈️', transport: '🚃', food: '🍜', shopping: '🛍️', sightseeing: '⛩️', hotel: '🏨' };
    const DAY_KEY = 'japan2026.dayIndex';

    function renderDayBar() {
      const bar = document.getElementById('dayBar');
      bar.innerHTML = APP.data.schedule.map((d, i) => {
        const md = (d.date || '').slice(5).replace('-', '/');
        return `<button class="day-chip" type="button" data-day-index="${i}" aria-pressed="false">
            <span class="chip-day">${esc(d.day)}</span>
            <span class="chip-date">${esc(md)} ${esc((d.weekday || '').replace('週', ''))}</span>
          </button>`;
      }).join('');
      bar.addEventListener('click', (e) => {
        const chip = e.target.closest('.day-chip');
        if (chip) selectDay(Number(chip.dataset.dayIndex));
      });
    }

    function renderTimelineItem(it) {
      const time = it.time_start
        ? `<span class="t-start">${esc(it.time_start)}</span>${it.time_end ? `<span class="t-end">${esc(it.time_end)}</span>` : ''}`
        : '<span class="t-none">彈性</span>';
      const tags = [];
      if (it.location_tag) tags.push(`<span class="tag">📍 ${esc(it.location_tag)}</span>`);
      if (it.transport) tags.push(`<span class="tag">🚃 ${esc(it.transport)}</span>`);
      if (it.price) tags.push(`<span class="tag">💴 ${esc(it.price)}</span>`);
      if (it.booked && it.booked !== '不適用') {
        const yes = /^(已|是|yes|v|o|ok)|✔|✓|已訂|已預約|已購/i.test(it.booked.trim());
        tags.push(`<span class="tag ${yes ? 'booked-yes' : ''}">🎫 ${esc(it.booked)}</span>`);
      }
      const isRoute = /→|➔|->/.test(it.spot);
      const map = it.spot && !isRoute
        ? `<a class="map-link" href="${mapUrl(it.spot)}" target="_blank" rel="noopener">🗺️ 地圖</a>` : '';
      const remarks = it.remarks
        ? `<details class="tl-remarks"><summary>備註</summary><p>${esc(it.remarks)}</p></details>` : '';
      return `<article class="tl-item cat-${esc(it.category || 'other')}" data-day="${esc(it.day)}" id="${esc(it.id)}">
          <div class="tl-time">${time}</div>
          <div class="tl-dot" aria-hidden="true">${CAT_ICON[it.category] || '📌'}</div>
          <div class="tl-card">
            <div class="tl-title"><span>${esc(it.spot || '（未命名）')}</span>${map}</div>
            ${tags.length ? `<div class="tl-meta">${tags.join('')}</div>` : ''}
            ${remarks}
          </div>
        </article>`;
    }

    function selectDay(idx) {
      const days = APP.data.schedule;
      if (!days[idx]) idx = 0;
      APP.dayIndex = idx;
      try { localStorage.setItem(DAY_KEY, String(idx)); } catch (_) {}
      const day = days[idx];

      document.querySelectorAll('#dayBar .day-chip').forEach(c => {
        const on = Number(c.dataset.dayIndex) === idx;
        c.classList.toggle('active', on);
        c.setAttribute('aria-pressed', on);
        if (on) {
          const bar = c.parentElement;
          bar.scrollTo({ left: Math.max(0, c.offsetLeft - (bar.clientWidth - c.offsetWidth) / 2), behavior: 'smooth' });
        }
      });

      document.getElementById('daySummary').innerHTML =
        `<h2>${esc(day.day)}・${esc(day.title || '')}</h2><span class="count">${esc(day.date)} ${esc(day.weekday || '')}・${day.items.length} 站</span>`;

      const items = day.items.filter(it => it.day === day.day);
      document.getElementById('timeline').innerHTML = items.length
        ? items.map(renderTimelineItem).join('')
        : '<div class="empty-state">這天尚未安排行程</div>';

      // Keep the day bar in view without jumping above the timeline
      const bar = document.getElementById('dayBar');
      const barTop = bar.getBoundingClientRect().top;
      const stickyTop = parseFloat(getComputedStyle(bar).top) || 0;
      if (barTop <= stickyTop + 1) {
        const anchor = document.getElementById('schedule-container');
        window.scrollTo({ top: anchor.offsetTop - stickyTop - bar.offsetHeight - 4, behavior: 'instant' });
      }
    }

    function initialDayIndex() {
      const today = new Date();
      const iso = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const t = APP.data.schedule.findIndex(d => d.date === iso);
      if (t >= 0) return t;
      const saved = Number(localStorage.getItem(DAY_KEY));
      return Number.isInteger(saved) && APP.data.schedule[saved] ? saved : 0;
    }

    function renderSchedule() {
      renderDayBar();
      selectDay(initialDayIndex());
    }

    // ===== Copy utility + Toast (Task 2.4) =====
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function legacyCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      ta.remove();
      return ok;
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* fall through to legacy */ }
      return legacyCopy(text);
    }

    // Event delegation: any [data-copy] element anywhere copies its value
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      e.preventDefault();
      const ok = await copyText(btn.dataset.copy);
      showToast(ok ? `✅ 已複製：${btn.dataset.copyLabel || btn.dataset.copy}` : '⚠️ 複製失敗，請長按文字手動複製');
    });

    const copyBtn = (value, label) => value
      ? `<button type="button" class="btn copy-btn" data-copy="${esc(value)}" data-copy-label="${esc(label || value)}" aria-label="複製${esc(label || '')}">📋 複製</button>` : '';
    const telHref = (tel) => 'tel:' + String(tel).replace(/[^\d+]/g, '');

    // ===== Flights =====
    function renderFlights() {
      const el = document.getElementById('flights-container');
      const flights = APP.data.flights || [];
      if (!flights.length) { el.innerHTML = '<div class="empty-state">尚無航班資料</div>'; return; }
      el.innerHTML = flights.map(f => {
        const dep = f.departure || {}, arr = f.arrival || {};
        const inbound = /回程|inbound/i.test(f.type + f.id);
        const meta = [
          f.airline && `<span class="tag">🛫 ${esc(f.airline)}</span>`,
          f.baggage && `<span class="tag">🧳 ${esc(f.baggage)}</span>`,
          f.status && `<span class="tag booked-yes">● ${esc(f.status)}</span>`,
        ].filter(Boolean).join('');
        const steps = [dep.action && `🛫 ${esc(dep.action)}`, arr.action && `🛬 ${esc(arr.action)}`]
          .filter(Boolean).map(s => `<div>${s}</div>`).join('');
        return `<article class="card flight-card ${inbound ? 'inbound' : 'outbound'}" id="${esc(f.id)}">
            <div class="flight-head">
              <span class="f-type">${inbound ? '🛬' : '🛫'} ${esc(f.type)}・${esc(f.flight_no || '')}</span>
              <span class="f-date">${esc(f.date || '')} ${esc(f.day || '')}</span>
            </div>
            <div class="flight-body">
              <div class="flight-route">
                <div class="f-end dep">
                  <div class="f-time">${esc(dep.time || '--:--')}</div>
                  <div class="f-airport">${esc(dep.airport || '')}</div>
                  <div class="f-terminal">${esc(dep.terminal || '')}</div>
                </div>
                <div class="f-mid"><span class="plane">✈️</span>${esc(f.duration || '')}</div>
                <div class="f-end arr">
                  <div class="f-time">${esc(arr.time || '--:--')}</div>
                  <div class="f-airport">${esc(arr.airport || '')}</div>
                  <div class="f-terminal">${esc(arr.terminal || '')}</div>
                </div>
              </div>
              ${meta ? `<div class="flight-meta">${meta}</div>` : ''}
              ${steps ? `<div class="flight-steps">${steps}</div>` : ''}
              ${f.notes ? `<div class="flight-note">💡 ${esc(f.notes)}</div>` : ''}
            </div>
          </article>`;
      }).join('');
    }

    // ===== Coupons =====
    function renderCoupons() {
      const el = document.getElementById('coupons-container');
      const coupons = APP.data.coupons || [];
      if (!coupons.length) { el.innerHTML = '<div class="empty-state">尚無優惠資料</div>'; return; }
      el.innerHTML = `<div class="coupon-grid">${coupons.map(c => `
          <article class="card coupon-card" id="${esc(c.id)}">
            ${c.badge ? `<span class="badge">${esc(c.badge)}</span>` : ''}
            <div class="c-title">${esc(c.title)}</div>
            ${c.description ? `<div class="c-desc">${esc(c.description)}</div>` : ''}
            ${c.category ? `<div class="c-cat">#${esc(c.category)}</div>` : ''}
            <div class="card-actions">
              ${c.url ? `<a class="btn btn-primary" href="${esc(c.url)}" target="_blank" rel="noopener">開啟 ↗</a>` : ''}
              ${c.url ? `<button type="button" class="btn copy-btn" data-copy="${esc(c.url)}" data-copy-label="連結">🔗 複製</button>` : ''}
            </div>
          </article>`).join('')}</div>`;
    }

    // ===== Practical info =====
    function infoRow(label, value, { tel = false, map = false } = {}) {
      if (!value) return '';
      const shown = tel ? `<a href="${telHref(value)}">${esc(value)}</a>` : esc(value);
      return `<div class="info-row">
          <div class="info-text"><div class="info-label">${esc(label)}</div><div class="info-value">${shown}</div></div>
          <div class="card-actions">
            ${tel ? `<a class="btn btn-blue" href="${telHref(value)}">📞 撥打</a>` : ''}
            ${map ? `<a class="btn btn-blue" href="${mapUrl(value)}" target="_blank" rel="noopener">🗺️</a>` : ''}
            ${copyBtn(value, label)}
          </div>
        </div>`;
    }

    function renderPractical() {
      const el = document.getElementById('practical-container');
      const p = APP.data.practical || {};
      const html = [];

      if (p.accommodations?.length) {
        html.push('<div class="sub-title">🏨 住宿</div>');
        html.push(p.accommodations.map(a => `<div class="card">
            <div class="info-name">${esc(a.name)}</div>
            ${infoRow('地址', a.address, { map: true })}
            ${a.check_in || a.check_out ? `<div class="tl-meta">${a.check_in ? `<span class="tag">Check-in ${esc(a.check_in)}</span>` : ''}${a.check_out ? `<span class="tag">Check-out ${esc(a.check_out)}</span>` : ''}</div>` : ''}
            ${a.notes ? `<div class="info-note">${esc(a.notes)}</div>` : ''}
          </div>`).join(''));
      }

      if (p.emergency_contacts?.length) {
        html.push('<div class="sub-title">🚨 緊急聯絡</div>');
        html.push(p.emergency_contacts.map(c => `<div class="card">
            <div class="info-name">${esc(c.name)}</div>
            ${infoRow('電話', c.tel, { tel: true })}
            ${infoRow('急難救助', c.emergency_tel, { tel: true })}
            ${/\d/.test(c.address || '') && !/直撥/.test(c.address) ? infoRow('地址', c.address, { map: true }) : (c.address ? `<div class="info-note">${esc(c.address)}</div>` : '')}
          </div>`).join(''));
      }

      if (p.luggage_storage?.length) {
        html.push('<div class="sub-title">🧳 行李寄放</div>');
        html.push(p.luggage_storage.map(s => `<div class="card">
            <div class="info-name">${esc(s.name)}</div>
            ${infoRow('位置', s.location, { map: true })}
            ${s.hours ? `<div class="tl-meta"><span class="tag">🕘 ${esc(s.hours)}</span></div>` : ''}
            ${s.notes ? `<div class="info-note">${esc(s.notes)}</div>` : ''}
          </div>`).join(''));
      }

      if (p.useful_links?.length) {
        html.push('<div class="sub-title">🔗 實用連結</div>');
        html.push(p.useful_links.map(l => `<div class="card">
            <div class="info-row">
              <div class="info-text"><div class="info-name">${esc(l.title)}</div><div class="info-note">${esc(l.desc || '')}</div></div>
              <div class="card-actions"><a class="btn btn-primary" href="${esc(l.url)}" target="_blank" rel="noopener">開啟 ↗</a></div>
            </div>
          </div>`).join(''));
      }

      const todos = APP.data.todos || [];
      if (todos.length) {
        html.push('<div class="sub-title">📝 待辦與口袋清單</div>');
        html.push(todos.map(t => `<div class="card">
            <div class="info-name">${esc(t.category)}</div>
            <ul class="todo-list">${(t.items || []).map(i => `<li class="tag">${esc(i)}</li>`).join('')}</ul>
          </div>`).join(''));
      }

      el.innerHTML = html.join('') || '<div class="empty-state">尚無實用資訊</div>';
    }

    // ===== Boot =====
    async function loadData() {
      const res = await fetch('itinerary_data.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    loadData()
      .then(data => {
        APP.data = data;
        // Render each view independently so one malformed section can't blank the others
        [renderSchedule, renderFlights, renderCoupons, renderPractical].forEach(fn => {
          try { fn(); } catch (err) { console.warn(fn.name + ' failed', err); }
        });
      })
      .catch(err => {
        console.warn('Failed to load itinerary data', err);
        document.getElementById('timeline').innerHTML =
          '<div class="empty-state">⚠️ 無法載入行程資料，請確認網路或重新整理。</div>';
      });
  </script>
</body>
</html>
